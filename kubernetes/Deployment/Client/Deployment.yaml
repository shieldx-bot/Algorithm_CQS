apiVersion: apps/v1
kind: Deployment
metadata:
  name:  client
  namespace: client-ns
  labels:
    app:  client
spec:
  selector:
    matchLabels:
      app: client
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app:  client
    spec:
      # initContainers:
        # Init containers are exactly like regular containers, except:
          # - Init containers always run to completion.
          # - Each init container must complete successfully before the next one starts.
      containers:
      - name:  client
        image:  shieldxbot/client:v0.0.14
        resources:
          requests:
            cpu: 300m
            memory: 300Mi
          limits:
            cpu: 300m
            memory: 300Mi
        livenessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 5
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /_status/healthz
            port: 3000
          initialDelaySeconds: 5
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 3
          periodSeconds: 10
        env:
        - name: LAMINAR_PROXY_HOST
          value: "postgres.postgre-db.svc.cluster.local"
        - name: LAMINAR_DB_HOST
          value: "postgres"
        - name: LAMINAR_DB_PORT
          value: "5432"
        - name: LAMINAR_DB_NAME
          value: "laminar"
        - name: LAMINAR_DB_USER
          value: "laminar"
        - name: LAMINAR_DB_PASSWORD
          value: "Vananh12345"  
        - name : LAMINAR_REDIS_HOST
          value: "redis://redis.postgre-db.svc.cluster.local:6380"
        - name : LAMINAR_REDIS_PORT
          value: "6380"
        - name: "MY_IP_PUBLIC"
          value: "client.client-ns.svc.cluster.local"
        - name: LAMINAR_BALANCER_HOST
          value: "balancer.balancer-ns.svc.cluster.local"
        - name: LAMINAR_BALANCER_PORT
          value: "8085"
        ports: 
        - containerPort:  3000
          name:  client
        volumeMounts:
        - name: localtime
          mountPath: /etc/localtime
      volumes:
        - name: localtime
          hostPath:
            path: /usr/share/zoneinfo/Asia/Shanghai
      restartPolicy: Always